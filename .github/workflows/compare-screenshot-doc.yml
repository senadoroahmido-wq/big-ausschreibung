name: Compare screenshot document media

on:
  push:
    branches:
      - analysis/ad-extract-20260914
    paths:
      - '.github/workflows/compare-screenshot-doc.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/ad-extract-20260914

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          python3 -m pip install --quiet pillow pytesseract

      - name: Compare media and OCR only unique images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, io
          from PIL import Image
          import pytesseract

          base = Path('BIG_Betriebshandbuch_Frankfurt.docx')
          shot = Path('Bildschirmfoto 2026-08-31 um 14.19.10.docx')
          out = Path('extracted/screenshot_unique_media.txt')
          out.parent.mkdir(exist_ok=True)

          def media_map(path):
              result = {}
              with zipfile.ZipFile(path) as z:
                  for n in z.namelist():
                      if n.startswith('word/media/'):
                          b = z.read(n)
                          result[n] = (hashlib.sha256(b).hexdigest(), b)
              return result

          bm = media_map(base)
          sm = media_map(shot)
          base_hashes = {h for h, _ in bm.values()}
          unique = [(n, h, b) for n, (h, b) in sm.items() if h not in base_hashes]

          lines = [f'Base media count: {len(bm)}', f'Screenshot-doc media count: {len(sm)}', f'Unique media count: {len(unique)}']
          for n, h, b in unique:
              lines += [f'\n=== UNIQUE {n} ===', f'sha256={h}', f'bytes={len(b)}']
              try:
                  im = Image.open(io.BytesIO(b))
                  lines.append(f'format={im.format} size={im.size}')
                  text = pytesseract.image_to_string(im, lang='deu+eng')
                  lines.append('--- OCR ---')
                  lines.append(text)
              except Exception as e:
                  lines.append(f'OCR unsupported: {e}')

          out.write_text('\n'.join(lines), encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/screenshot_unique_media.txt
          git commit -m "Compare screenshot document media" || exit 0
          git push origin HEAD:analysis/ad-extract-20260914
